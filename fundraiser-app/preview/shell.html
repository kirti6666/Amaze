<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barakah Desktop Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: top bar with mode switch; "app" mode = screen list | phone | scope checklist, "admin" mode = sidebar + workspace. Light only, matching the app. */
:root {
  --brand: #0a9b3c; --brand-2: #3ddbbd; --brand-3: #1fc95c; --brand-ink: #087a30; --brand-soft: #dcf7ea;
  --raised: #25cf98; --gold: #e9b52c; --gold-soft: #fff5d6; --ink: #15151f; --ink-2: #3d3d4a; --muted: #85858f;
  --line: #e6e6ec; --bg: #f1f1f5; --card: #ffffff; --chip: #ececf1; --danger: #d9434b; --danger-soft: #fdeaea;
  --amber: #8a5a00; --amber-soft: #fff1d6; --blue: #1f5fbf; --blue-soft: #e3eefc;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.bar-top { position: sticky; top: 0; z-index: 10; height: 60px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -0.04em; color: var(--brand); }
.brand svg { width: 26px; height: 26px; }
.brand small { font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.modes { display: flex; background: var(--chip); border-radius: 99px; padding: 3px; margin-left: auto; }
.modes button { padding: 7px 16px; border-radius: 99px; font-weight: 600; color: var(--muted); }
.modes button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }

/* app mode */
.stage { display: grid; grid-template-columns: 250px minmax(0, 1fr) 340px; gap: 24px; padding: 24px; max-width: 1400px; margin: 0 auto; align-items: start; }
.panel { background: var(--card); border-radius: 20px; padding: 16px; position: sticky; top: 84px; max-height: calc(100vh - 108px); overflow-y: auto; }
.panel h2 { font-size: 15px; margin-bottom: 4px; }
.panel .lead { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
.group { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 16px 0 6px; }
.group:first-of-type { margin-top: 4px; }
.screen-btn { display: flex; width: 100%; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; text-align: left; color: var(--ink-2); font-weight: 500; }
.screen-btn:hover { background: var(--bg); }
.screen-btn.on { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
.phone-col { display: grid; justify-items: center; gap: 14px; }
.phone { width: 404px; height: 860px; border-radius: 54px; background: #111; padding: 12px; box-shadow: 0 30px 60px rgb(20 20 40 / 0.18), inset 0 0 0 2px #2a2a2a; position: relative; }
.screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--card); display: grid; grid-template-rows: 34px 1fr; }
.status { display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; font-weight: 600; font-size: 13px; background: var(--card); position: relative; }
.status::after { content: ""; position: absolute; left: 50%; top: 9px; width: 18px; height: 18px; border-radius: 50%; background: #111; transform: translateX(-50%); }
.status span { display: flex; gap: 5px; align-items: center; }
.status svg { width: 15px; height: 15px; fill: currentColor; }
.screen iframe { width: 100%; height: 100%; border: 0; display: block; }
.phone-note { color: var(--muted); font-size: 12.5px; text-align: center; max-width: 380px; }
.feat-sec { border-top: 1px solid var(--line); padding: 12px 0 4px; }
.feat-sec:first-of-type { border-top: 0; padding-top: 4px; }
.feat-sec h3 { font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.feat-sec h3 span { color: var(--brand); font-weight: 600; font-size: 12px; }
.feat { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 13px; color: var(--ink-2); }
.feat > svg.i { color: var(--brand); width: 16px; height: 16px; margin-top: 2px; stroke-width: 2.6; }
.feat .t { flex: 1; min-width: 0; }
.feat button { color: var(--brand-ink); font-weight: 600; font-size: 12px; white-space: nowrap; padding: 2px 8px; border-radius: 99px; background: var(--brand-soft); }
.summary { display: flex; gap: 10px; align-items: center; background: var(--brand-soft); color: var(--brand-ink); border-radius: 14px; padding: 10px 12px; font-weight: 600; font-size: 13px; margin-bottom: 12px; }

/* admin mode */
.admin { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 60px); }
.side { background: var(--card); border-right: 1px solid var(--line); padding: 16px 12px; display: grid; align-content: start; gap: 2px; position: sticky; top: 60px; height: calc(100vh - 60px); }
.side button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; font-weight: 500; color: var(--ink-2); text-align: left; }
.side button:hover { background: var(--bg); }
.side button.on { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
.side .count { margin-left: auto; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 6px; }
.work { padding: 24px 28px 40px; min-width: 0; display: grid; gap: 18px; align-content: start; max-width: 1240px; }
.work-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.work-head h1 { font-size: 24px; }
.work-head p { color: var(--muted); width: 100%; margin-top: -8px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 4px; }
.kpi span { color: var(--muted); font-size: 12.5px; }
.kpi b { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.kpi small { color: var(--brand); font-weight: 600; font-size: 12px; }
.card { background: var(--card); border-radius: 16px; padding: 16px; min-width: 0; }
.card h2 { font-size: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td .sub { display: block; color: var(--muted); font-size: 12px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.p-live, .p-approved, .p-active, .p-verified { background: var(--brand-soft); color: var(--brand-ink); }
.p-review, .p-pending, .p-requested { background: var(--amber-soft); color: var(--amber); }
.p-paid, .p-completed { background: var(--blue-soft); color: var(--blue); }
.p-rejected, .p-suspended, .p-blocked { background: var(--danger-soft); color: var(--danger); }
.clip { display: block; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { display: flex; gap: 6px; justify-content: flex-end; }
.b { height: 32px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.b-main { background: var(--brand); color: #fff; }
.b-soft { background: var(--chip); color: var(--ink); }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-lg { height: 40px; padding: 0 16px; font-size: 14px; border-radius: 10px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { height: 32px; padding: 0 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-weight: 500; font-size: 13px; }
.filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.attn { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.attn:last-child { border-bottom: 0; }
.attn .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.attn .t { flex: 1; }
.attn .t span { display: block; color: var(--muted); font-size: 12.5px; }
.hbar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 90px; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; }
.hbar .track { height: 8px; background: var(--chip); border-radius: 9px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-2), var(--brand-3)); border-radius: 9px; }
.hbar b { text-align: right; font-weight: 600; }
.queue { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.q { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.q-head { display: flex; gap: 10px; align-items: center; }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
.q-head .t { flex: 1; min-width: 0; }
.q-head .t span { display: block; color: var(--muted); font-size: 12.5px; }
.docs { display: flex; flex-wrap: wrap; gap: 6px; }
.doc { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--bg); font-size: 12.5px; font-weight: 500; }
.doc svg.i { width: 15px; height: 15px; color: var(--muted); }
.form { display: grid; gap: 14px; max-width: 560px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 13px; }
.field .hint { color: var(--muted); font-size: 12px; }
.input, .select, .textarea { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--card); outline: none; }
.textarea { height: 200px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--brand); }
.toggle-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle-row:last-child { border-bottom: 0; }
.toggle-row .t { flex: 1; }
.toggle-row .t span { display: block; color: var(--muted); font-size: 12.5px; }
.sw { width: 40px; height: 24px; border-radius: 99px; background: #cfd3db; position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw.on { background: var(--brand); }
.sw.on::after { transform: translateX(16px); }
.dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; vertical-align: -1px; margin-right: 8px; }
.modal-scrim { position: fixed; inset: 0; background: rgb(15 15 30 / 0.4); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--card); border-radius: 18px; padding: 20px; width: min(560px, 100%); display: grid; gap: 14px; }
.modal h2 { font-size: 18px; }
.doc-preview { height: 220px; border-radius: 12px; background: repeating-linear-gradient(0deg, var(--bg) 0 14px, var(--card) 14px 28px); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 600; z-index: 60; }
[hidden] { display: none !important; }

@media (max-width: 1180px) { .stage { grid-template-columns: 220px minmax(0, 1fr); } .stage .checklist { grid-column: 1 / -1; position: static; max-height: none; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .stage { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 0; }
  .stage .screens { display: none; }
  .phone { width: 100%; height: calc(100vh - 60px); border-radius: 0; padding: 0; box-shadow: none; background: none; }
  .screen { border-radius: 0; grid-template-rows: 0 1fr; }
  .status { overflow: hidden; padding: 0; }
  .phone-note { display: none; }
  .stage .checklist { border-radius: 0; }
  .brand small { display: none; }
  .admin { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side button { flex: none; }
  .work { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar-top">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16.5 4.5a11.5 11.5 0 1 0 11 15A9.2 9.2 0 1 1 16.5 4.5Z"/><path fill="#e9b52c" d="M23.3 7.2l1 2.3 2.4.3-1.8 1.6.5 2.4-2.1-1.2-2.1 1.2.5-2.4-1.8-1.6 2.4-.3Z"/></svg>barakah<small>Desktop preview</small></div>
  <div class="modes" role="tablist"><button class="on" data-mode="app" role="tab">Mobile app</button><button data-mode="admin" role="tab">Admin panel</button></div>
</header>

<main id="mode-app" class="stage">
  <aside class="panel screens"><h2>Screens</h2><p class="lead">Click to jump. You can also tap around inside the phone.</p><div id="screen-list"></div></aside>
  <section class="phone-col">
    <div class="phone"><div class="screen">
      <div class="status"><span class="num">9:41</span><span><svg viewBox="0 0 24 24"><path d="M2 20h3v-4H2zm5 0h3v-8H7zm5 0h3V8h-3zm5 0h3V4h-3z"/></svg><svg viewBox="0 0 24 24"><path d="M12 18.5a1.5 1.5 0 1 0 0 .01ZM12 6C8 6 4.5 7.6 2 10l1.8 1.8C5.8 9.9 8.7 8.6 12 8.6s6.2 1.3 8.2 3.2L22 10c-2.5-2.4-6-4-10-4Zm0 5c-2.3 0-4.4.9-6 2.4l1.8 1.8A6 6 0 0 1 12 13.6c1.6 0 3.1.6 4.2 1.6l1.8-1.8A8.6 8.6 0 0 0 12 11Z"/></svg><svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="9" width="12" height="6" rx="1"/><rect x="21" y="10" width="1.6" height="4" rx=".8"/></svg></span></div>
      <iframe id="app-frame" title="Barakah Android app"></iframe>
    </div></div>
    <p class="phone-note">The same code runs inside the Android APK. All data is sample data and payments are simulated.</p>
  </section>
  <aside class="panel checklist"><h2>Scope checklist</h2><p class="lead">Each item from the proposed scope and where it is in the UI.</p><div id="feature-list"></div></aside>
</main>

<main id="mode-admin" class="admin" hidden>
  <nav class="side" id="admin-nav"></nav>
  <section class="work" id="admin-work"></section>
</main>

<script type="text/plain" id="app-css">{{APP_CSS}}</script>
<script type="text/plain" id="app-js">{{APP_JS}}</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const P = {
  check: '<path d="M20 6 9 17l-5-5"/>', grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  flag: '<path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"/>', shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>', users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  tag: '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4Z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8M16 17H8"/>',
  sliders: '<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>', bank: '<path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7"/><path d="m12 2 8 5H4z"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
function toast(m) { document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; t.setAttribute('role', 'status'); document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ---------- mobile app in the phone frame ---------- */
const frame = $('#app-frame');
frame.srcdoc = `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><style>${$('#app-css').textContent}</style></head><body><div id="app"></div><script>${$('#app-js').textContent}<\/script></body></html>`;
const win = () => frame.contentWindow;
const click = sel => setTimeout(() => win().document.querySelector(sel)?.click(), 120);
const open = hash => { win().location.hash = hash; };
// screens that need a few taps to reach a realistic state
const flows = {
  success: () => { open('#/donate/1'); click('[data-act=pay]'); },
  share: () => { open('#/home'); click('[data-act=share]'); },
  donors: () => { open('#/c/1'); click('[data-k=dTab][data-v=donors]'); },
  update: () => { open('#/my'); click('[data-act=postUpdate]'); },
  step2: () => { open('#/start'); win().eval('S.draft = null; render()'); setTimeout(() => { const d = win().document; const f = (id, v) => { const el = d.getElementById(id); if (!el) return; el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); }; f('f-title', 'Help my neighbour Salma with eye surgery'); f('f-goal', '150000'); d.querySelector('[data-act=wizNext]')?.click(); }, 250); },
  overall: () => { open('#/rating'); click('[data-k=rate][data-v=overall]'); },
  reports: () => { open('#/completed'); click('[data-k=comp][data-v=reports]'); },
};
const SCREENS = [
  ['Start', [['Login & OTP', '#/login']]],
  ['Tabs', [['Campaigns (home)', '#/home'], ['Completed', '#/completed'], ['Completed reports', 'reports'], ['Rating · your league', '#/rating'], ['Rating · overall', 'overall'], ['News', '#/news'], ['Notifications', '#/news/notifications'], ['Profile', '#/profile']]],

  nav: v => adminGo(v),
  campFilter: v => { DB.campFilter = v; renderAdmin(); },
  camp: (v, el) => { const c = DB.campaigns.find(x => x.id === Number(v)); c.status = el.dataset.s; delete c.submitted; toast({ live: 'Approved. The organiser has been emailed.', rejected: 'Rejected. The organiser has been emailed the reason.', suspended: 'Suspended. Donations are paused.' }[c.status]); renderAdmin(); },
  verify: (v, el) => { DB.verify.find(x => x.id === v).status = el.dataset.s; toast(el.dataset.s === 'verified' ? 'Marked as verified' : 'Rejected and organiser notified'); renderAdmin(); },
  wd: (v, el) => { DB.withdrawals.find(x => x.id === v).status = el.dataset.s; toast({ approved: 'Withdrawal approved', paid: 'Marked as paid. Organiser notified.', rejected: 'Withdrawal rejected' }[el.dataset.s]); renderAdmin(); },
  user: v => { const u = DB.users[Number(v)]; u[4] = u[4] === 'active' ? 'blocked' : 'active'; renderAdmin(); },
  cat: v => { const c = DB.cats[Number(v)]; c[3] = !c[3]; renderAdmin(); },
  set: v => { DB.settings[v] = !DB.settings[v]; renderAdmin(); },
  toast: v => toast(v),
  doc: v => modal(`<h2>${esc(v)}</h2><div class="doc-preview">Document preview</div><div class="acts"><button class="b b-soft b-lg" data-close>Close</button></div>`),
  preview: v => { const c = DB.campaigns.find(x => x.id === Number(v)); modal(`<h2>${esc(c.title)}</h2><p style="color:var(--muted)">${esc(c.org)} · ${c.cat} · goal ${inr(c.goal)}</p><div class="docs">${['Cost estimate', 'Beneficiary ID', 'Photos (3)', 'Organiser KYC'].map(d => `<span class="doc">${ic('file')}${d}</span>`).join('')}</div><div class="doc-preview">Document preview</div><div class="acts"><button class="b b-soft b-lg" data-close>Close</button></div>`); },
  edit: v => { const p = DB.pages[Number(v)]; const m = modal(`<h2>Edit: ${p[0]}</h2><form data-f="page" data-v="${v}" style="display:grid;gap:12px"><textarea class="textarea" id="page-body" placeholder="Paste the approved text here">${p[1].startsWith('Awaiting') ? '' : 'Barakah connects people who want to give with verified NGOs and families who need help.'}</textarea><div class="acts"><button type="button" class="b b-soft b-lg" data-close>Cancel</button><button class="b b-main b-lg">Publish</button></div></form>`); m.querySelector('textarea').focus(); },
  csv: () => {
    const csv = ['Transaction,Donor,Fundraiser,Amount,Type,Method,Time', ...DB.donations.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(','))].join('\n');
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'barakah-donations.csv'; a.click(); } catch { /* download blocked in some viewers */ }
    toast('CSV exported');
  },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && ACT[el.dataset.a]) { e.preventDefault(); ACT[el.dataset.a](el.dataset.v, el); } });
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.f === 'cat') { DB.cats.push([f.querySelector('input').value.trim(), '#3d3d4a', 0, true]); toast('Category added'); renderAdmin(); }
  if (f.dataset.f === 'page') { DB.pages[Number(f.dataset.v)][1] = '25 Oct 2026'; f.closest('.modal-scrim').remove(); toast('Page published'); renderAdmin(); }
});
</script>
</body>
</html>
