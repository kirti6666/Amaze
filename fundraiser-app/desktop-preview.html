      <div class="card"><h2>Recent donations <button class="b b-soft" data-a="nav" data-v="donations">View all</button></h2><div class="table-wrap">${donTable(DB.donations.slice(0, 5), true)}</div></div>
      <div class="card"><h2>Needs attention</h2>
        ${[['flag', 'Fundraisers to review', p.campaigns + ' waiting', 'campaigns', 'var(--amber-soft)', 'var(--amber)'], ['shield', 'KYC and documents', p.verification + ' waiting', 'verification', 'var(--blue-soft)', 'var(--blue)'], ['wallet', 'Withdrawal requests', p.withdrawals + ' to approve', 'withdrawals', 'var(--brand-soft)', 'var(--brand-ink)']].map(([i, t, s, v, bg, fg]) => `<div class="attn"><span class="ic" style="background:${bg};color:${fg}">${ic(i)}</span><span class="t"><b>${t}</b><span>${s}</span></span><button class="b b-soft" data-a="nav" data-v="${v}">Review</button></div>`).join('')}
        <h2 style="margin-top:16px">Raised by cause, this month</h2>
        ${[['Medical', 46], ['Food & Iftar', 22], ['Emergency', 14], ['Education', 9], ['Water', 6], ['Masjid', 3]].map(([l, v]) => `<div class="hbar"><span>${l}</span><span class="track"><i style="width:${v / 46 * 100}%"></i></span><b class="num">${inr(v * 41200)}</b></div>`).join('')}
      </div>
    </div>`; },
  campaigns: () => { const f = DB.campFilter; const list = DB.campaigns.filter(c => f === 'all' || c.status === f);
    return head('Fundraisers', 'Review new fundraisers before they go live. Suspend anything that breaks the rules.') + `
    <div class="filters">${[['all', 'All'], ['review', 'Pending review'], ['live', 'Live'], ['suspended', 'Suspended'], ['completed', 'Completed']].map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-a="campFilter" data-v="${k}">${l} <span class="num">${k === 'all' ? DB.campaigns.length : DB.campaigns.filter(c => c.status === k).length}</span></button>`).join('')}</div>
    <div class="card"><div class="table-wrap"><table><thead><tr><th>Fundraiser</th><th>Category</th><th class="r">Raised / goal</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>
    ${list.map(c => `<tr><td><b>${esc(c.title)}</b><span class="sub">${esc(c.org)}${c.submitted ? ' · submitted ' + c.submitted : ''}</span></td><td>${c.cat}</td><td class="r num">${inr(c.raised)} <span class="sub">of ${inr(c.goal)}</span></td><td>${pill(c.status)}</td><td><div class="acts">${
      c.status === 'review' ? `<button class="b b-soft" data-a="preview" data-v="${c.id}">Documents</button><button class="b b-danger" data-a="camp" data-v="${c.id}" data-s="rejected">Reject</button><button class="b b-main" data-a="camp" data-v="${c.id}" data-s="live">Approve</button>`
      : c.status === 'live' ? `<button class="b b-danger" data-a="camp" data-v="${c.id}" data-s="suspended">Suspend</button>`
      : c.status === 'suspended' || c.status === 'rejected' ? `<button class="b b-soft" data-a="camp" data-v="${c.id}" data-s="live">Reinstate</button>` : '<span class="sub">Report published</span>'}</div></td></tr>`).join('') || '<tr><td colspan="5" class="sub">Nothing here.</td></tr>'}
    </tbody></table></div></div>`; },
  verification: () => head('Verification', 'Check organiser KYC, NGO registration, bank accounts and beneficiary documents.') + `<div class="queue">${DB.verify.map(v => `<div class="q"><div class="q-head">${avatar(v.who)}<span class="t"><b>${esc(v.who)}</b><span>${v.type}</span></span>${pill(v.status)}</div>
      <div class="docs">${v.docs.map(d => `<button class="doc" data-a="doc" data-v="${esc(d)}">${ic('file')}${esc(d)}</button>`).join('')}</div>
      ${v.status === 'pending' ? `<div class="acts" style="justify-content:flex-start"><button class="b b-main" data-a="verify" data-v="${v.id}" data-s="verified">Approve</button><button class="b b-danger" data-a="verify" data-v="${v.id}" data-s="rejected">Reject</button><button class="b b-soft" data-a="toast" data-v="Request sent to ${esc(v.who)}">Ask for more</button></div>` : ''}</div>`).join('')}</div>`,
  withdrawals: () => head('Withdrawals', 'Every payout needs a verified account and a matching bill.') + `<div class="card"><div class="table-wrap"><table><thead><tr><th>Request</th><th>Fundraiser</th><th class="r">Amount</th><th>Pay to</th><th>Bill</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>
    ${DB.withdrawals.map(w => `<tr><td class="num"><b>${w.id}</b></td><td>${esc(w.camp)}<span class="sub">${esc(w.org)}</span></td><td class="r num"><b>${inr(w.amt)}</b></td><td>${esc(w.to)}</td><td><button class="doc" data-a="doc" data-v="${esc(w.bill)}">${ic('file')}${esc(w.bill)}</button></td><td>${pill(w.status)}</td><td><div class="acts">${
      w.status === 'requested' ? `<button class="b b-danger" data-a="wd" data-v="${w.id}" data-s="rejected">Reject</button><button class="b b-main" data-a="wd" data-v="${w.id}" data-s="approved">Approve</button>`
      : w.status === 'approved' ? `<button class="b b-main" data-a="wd" data-v="${w.id}" data-s="paid">Mark paid</button>` : '<span class="sub">Done</span>'}</div></td></tr>`).join('')}
    </tbody></table></div></div>`,
  donations: () => head('Donations & reports', 'Every transaction, with Zakat tracked separately.', `<button class="b b-soft b-lg" data-a="csv">${ic('download')} Export CSV</button>`) + `
    <div class="kpis"><div class="kpi"><span>This month</span><b class="num">₹38.6 L</b><small>9,412 donations</small></div><div class="kpi"><span>Zakat</span><b class="num">₹14.2 L</b><small>37% of total</small></div><div class="kpi"><span>Donor tips</span><b class="num">₹1.9 L</b><small>avg 5.1%</small></div><div class="kpi"><span>Refunds</span><b class="num">₹12,400</b><small style="color:var(--muted)">6 requests</small></div></div>
    <div class="card"><h2>Transactions</h2><div class="table-wrap">${donTable(DB.donations)}</div></div>`,
  users: () => head('Users', 'Donors, organisers and NGOs.') + `<div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Joined</th><th class="r">Donations / campaigns</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>
    ${DB.users.map((u, i) => `<tr><td><span style="display:flex;align-items:center;gap:10px">${avatar(u[0])}<b>${esc(u[0])}</b></span></td><td>${u[1]}</td><td>${u[2]}</td><td class="r num">${u[3]}</td><td>${pill(u[4])}</td><td><div class="acts"><button class="b ${u[4] === 'active' ? 'b-danger' : 'b-soft'}" data-a="user" data-v="${i}">${u[4] === 'active' ? 'Block' : 'Unblock'}</button></div></td></tr>`).join('')}
    </tbody></table></div></div>`,
  categories: () => head('Categories', 'Causes shown as filters in the app and on the website.') + `<div class="card"><div class="table-wrap"><table><thead><tr><th>Category</th><th class="r">Fundraisers</th><th class="r">Shown in app</th></tr></thead><tbody>
    ${DB.cats.map((c, i) => `<tr><td><span class="dot" style="background:${c[1]}"></span><b>${esc(c[0])}</b></td><td class="r num">${c[2]}</td><td><div class="acts"><button class="sw ${c[3] ? 'on' : ''}" data-a="cat" data-v="${i}" role="switch" aria-checked="${c[3]}" aria-label="Show ${esc(c[0])}"></button></div></td></tr>`).join('')}
    </tbody></table></div>
    <form data-f="cat" style="display:flex;gap:8px;margin-top:14px;max-width:460px"><input class="input" id="new-cat" placeholder="New category name" required><button class="b b-main b-lg">Add</button></form></div>`,
  content: () => head('Website content', 'Pages shown in the app and on the website. Policy pages wait for the approved text.') + `<div class="card"><div class="table-wrap"><table><thead><tr><th>Page</th><th>Last updated</th><th class="r">Actions</th></tr></thead><tbody>
    ${DB.pages.map((p, i) => `<tr><td><b>${p[0]}</b></td><td class="${p[1].startsWith('Awaiting') ? '' : 'num'}">${p[1].startsWith('Awaiting') ? pill('pending').replace('Pending', p[1]) : p[1]}</td><td><div class="acts"><button class="b b-soft" data-a="edit" data-v="${i}">Edit</button></div></td></tr>`).join('')}
    </tbody></table></div></div>`,
  appearance: () => {
    let themes = [];
    try { themes = win().eval('THEMES'); } catch { /* app frame not ready */ }
    const sw = (k, t, d) => `<div class="toggle-row"><span class="t"><b>${t}</b><span>${d}</span></span><button class="sw ${DB[k] ? 'on' : ''}" data-a="themeOpt" data-v="${k}" role="switch" aria-checked="${DB[k]}" aria-label="${t}"></button></div>`;
    return head('App themes', 'Pick the theme everyone sees. Changes apply to the app instantly; watch the phone in Mobile app mode.') + `
    <div class="theme-grid">${themes.map(t => { const on = t.id === DB.themeDefault; return `<div class="th-admin ${on ? 'on' : ''}" style="background:${t.c.card};color:${t.c.ink};border-color:${on ? t.c.brand : t.c.line}">
      <div class="th-prev" style="background:${t.c.bg}"><span style="background:${t.c.brand}"></span><span style="background:${t.c.card}"></span><span style="background:${t.c.gold}"></span></div>
      <b>${esc(t.name)}</b><span style="color:${t.c.muted}">${esc(t.desc)}${t.dark ? ' · dark' : ''}${t.banner ? ' · seasonal card' : ''}</span>
      ${on ? `<span class="pill p-live">Default for everyone</span>` : `<button class="b b-soft" data-a="setTheme" data-v="${t.id}">Set as default</button>`}</div>`; }).join('')}</div>
    <div class="card" style="max-width:640px"><h2>Rules</h2>${sw('allowUsers', 'Let people choose their own theme', 'Off: everyone sees the default theme and the picker is locked')}${sw('autoRamzan', 'Switch to Ramzan during Ramadan', 'Turns on at the start of Ramadan and back after Eid')}${sw('autoEid', 'Switch to Eid Mubarak on Eid days', 'Eid al-Fitr and Eid al-Adha')}</div>`; },
  settings: () => { const s = DB.settings; const sw = (k, t, d) => `<div class="toggle-row"><span class="t"><b>${t}</b><span>${d}</span></span><button class="sw ${s[k] ? 'on' : ''}" data-a="set" data-v="${k}" role="switch" aria-checked="${s[k]}" aria-label="${t}"></button></div>`;
    return head('Fees & settings', 'Platform fee, voluntary contributions, payment methods and emails.') + `<div class="cols">
    <div class="card"><h2>Fees</h2><div class="form">
      <div class="field"><label for="fee">Platform fee charged to fundraisers (%)</label><input class="input num" id="fee" type="number" min="0" max="15" step="0.5" value="${s.fee}"><span class="hint">0% means fundraisers receive the full amount minus gateway charges.</span></div>
      ${sw('tips', 'Ask donors for a voluntary tip', 'Shown on the donate screen as 0 / 5 / 10 / 15%')}
      <div class="field"><label for="tipdef">Default tip (%)</label><select class="select" id="tipdef">${[0, 5, 10, 15].map(t => `<option ${s.tipDefault === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <button class="b b-main b-lg" style="justify-self:start" data-a="toast" data-v="Settings saved">Save fees</button></div></div>
    <div class="card"><h2>Payment methods</h2>${sw('upi', 'UPI', 'GPay, PhonePe, Paytm, BHIM')}${sw('card', 'Debit and credit cards', 'Visa, Mastercard, RuPay')}${sw('nb', 'Net banking', 'All major Indian banks')}${sw('intl', 'International cards', 'Needs FCRA registration for NGOs')}
      <h2 style="margin-top:18px">Email notifications</h2>${sw('mReceipt', 'Donation receipt', 'Sent to the donor with the 80G receipt')}${sw('mStatus', 'Fundraiser status', 'Submitted, approved, rejected, goal reached')}${sw('mWithdraw', 'Withdrawal status', 'Requested, approved, paid')}${sw('mWeekly', 'Weekly summary to organisers', 'Donations and visits in the last 7 days')}</div>
    </div>`; },
};
function donTable(rows, compact) {
  if (compact) return `<table><thead><tr><th>Donor</th><th>Fundraiser</th><th class="r">Amount</th><th>Time</th></tr></thead><tbody>${rows.map(r => `<tr><td style="white-space:nowrap">${esc(r[1])}<span class="sub">${r[4]} · ${r[5]}</span></td><td><span class="clip">${esc(r[2])}</span></td><td class="r num"><b>${inr(r[3])}</b></td><td class="num" style="white-space:nowrap">${r[6].split(', ')[1]}</td></tr>`).join('')}</tbody></table>`; return `<table><thead><tr><th>Transaction</th><th>Donor</th><th>Fundraiser</th><th class="r">Amount</th><th>Type</th><th>Method</th><th>Time</th></tr></thead><tbody>${rows.map(r => `<tr><td class="num">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="r num"><b>${inr(r[3])}</b></td><td>${r[4]}</td><td>${r[5]}</td><td class="num" style="white-space:nowrap">${r[6]}</td></tr>`).join('')}</tbody></table>`; }
function renderAdmin() {
  const p = pending();
  $('#admin-nav').innerHTML = NAV.map(([k, l, i]) => `<button class="${DB.section === k ? 'on' : ''}" data-a="nav" data-v="${k}">${ic(i)}${l}${p[k] ? `<span class="count">${p[k]}</span>` : ''}</button>`).join('');
  $('#admin-work').innerHTML = ADMIN[DB.section]();
}
function adminGo(s) { DB.section = s; renderAdmin(); window.scrollTo(0, 0); }
function modal(html) { const m = document.createElement('div'); m.className = 'modal-scrim'; m.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); }); document.body.appendChild(m); return m; }
const pushTheme = () => { try { win().adminTheme(DB.themeDefault, DB.allowUsers); } catch { /* app frame not ready */ } };
const ACT = {
  setTheme: v => { DB.themeDefault = v; pushTheme(); toast('Default theme updated for everyone'); renderAdmin(); },
  themeOpt: v => { DB[v] = !DB[v]; if (v === 'allowUsers') pushTheme(); renderAdmin(); },
  nav: v => adminGo(v),
  campFilter: v => { DB.campFilter = v; renderAdmin(); },
  camp: (v, el) => { const c = DB.campaigns.find(x => x.id === Number(v)); c.status = el.dataset.s; delete c.submitted; toast({ live: 'Approved. The organiser has been emailed.', rejected: 'Rejected. The organiser has been emailed the reason.', suspended: 'Suspended. Donations are paused.' }[c.status]); renderAdmin(); },
  verify: (v, el) => { DB.verify.find(x => x.id === v).status = el.dataset.s; toast(el.dataset.s === 'verified' ? 'Marked as verified' : 'Rejected and organiser notified'); renderAdmin(); },
  wd: (v, el) => { DB.withdrawals.find(x => x.id === v).status = el.dataset.s; toast({ approved: 'Withdrawal approved', paid: 'Marked as paid. Organiser notified.', rejected: 'Withdrawal rejected' }[el.dataset.s]); renderAdmin(); },
  user: v => { const u = DB.users[Number(v)]; u[4] = u[4] === 'active' ? 'blocked' : 'active'; renderAdmin(); },
  cat: v => { const c = DB.cats[Number(v)]; c[3] = !c[3]; renderAdmin(); },
  set: v => { DB.settings[v] = !DB.settings[v]; renderAdmin(); },
  toast: v => toast(v),
  doc: v => modal(`<h2>${esc(v)}</h2><div class="doc-preview">Document preview</div><div class="acts"><button class="b b-soft b-lg" data-close>Close</button></div>`),
  preview: v => { const c = DB.campaigns.find(x => x.id === Number(v)); modal(`<h2>${esc(c.title)}</h2><p style="color:var(--muted)">${esc(c.org)} · ${c.cat} · goal ${inr(c.goal)}</p><div class="docs">${['Cost estimate', 'Beneficiary ID', 'Photos (3)', 'Organiser KYC'].map(d => `<span class="doc">${ic('file')}${d}</span>`).join('')}</div><div class="doc-preview">Document preview</div><div class="acts"><button class="b b-soft b-lg" data-close>Close</button></div>`); },
  edit: v => { const p = DB.pages[Number(v)]; const m = modal(`<h2>Edit: ${p[0]}</h2><form data-f="page" data-v="${v}" style="display:grid;gap:12px"><textarea class="textarea" id="page-body" placeholder="Paste the approved text here">${p[1].startsWith('Awaiting') ? '' : 'Muslim Life Pro connects people who want to give with verified NGOs and families who need help.'}</textarea><div class="acts"><button type="button" class="b b-soft b-lg" data-close>Cancel</button><button class="b b-main b-lg">Publish</button></div></form>`); m.querySelector('textarea').focus(); },
  csv: () => {
    const csv = ['Transaction,Donor,Fundraiser,Amount,Type,Method,Time', ...DB.donations.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(','))].join('\n');
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'muslimlifepro-donations.csv'; a.click(); } catch { /* download blocked in some viewers */ }
    toast('CSV exported');
  },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && ACT[el.dataset.a]) { e.preventDefault(); ACT[el.dataset.a](el.dataset.v, el); } });
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.f === 'cat') { DB.cats.push([f.querySelector('input').value.trim(), '#3d3d4a', 0, true]); toast('Category added'); renderAdmin(); }
  if (f.dataset.f === 'page') { DB.pages[Number(f.dataset.v)][1] = '25 Oct 2026'; f.closest('.modal-scrim').remove(); toast('Page published'); renderAdmin(); }
});
</script>
</body>
</html>
