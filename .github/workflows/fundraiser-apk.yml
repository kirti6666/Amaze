name: Fundraiser demo APK

on:
  push:
    paths:
      - 'fundraiser-app/**'
      - '.github/workflows/fundraiser-apk.yml'
  workflow_dispatch:

# contents: write lets the job publish the APK as a release
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fundraiser-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      # app icon and splash screen with the Muslim Life Pro emblem
      - run: cp -r resources/android/res/. android/app/src/main/res/
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: fundraiser-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: muslim-life-pro-demo-apk
          path: fundraiser-app/android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MuslimLifePro-demo.apk && cp desktop-preview.html MuslimLifePro-preview-and-admin.html
      # one fixed, login-free download link that always holds the newest build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-latest
          name: Muslim Life Pro demo (latest build)
          prerelease: true
          overwrite_files: true
          files: |
            fundraiser-app/MuslimLifePro-demo.apk
            fundraiser-app/MuslimLifePro-preview-and-admin.html
          body: |
            Demo build of the Muslim Life Pro Android app. Sample data only; no real payments.
            Install: open MuslimLifePro-demo.apk on an Android phone, allow "Install unknown apps", then Install.
            Admin panel: download MuslimLifePro-preview-and-admin.html, open it in Chrome on a laptop and click "Admin panel" at the top right.
