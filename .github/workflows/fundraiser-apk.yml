name: Fundraiser demo APK

on:
  push:
    paths:
      - 'fundraiser-app/**'
      - '.github/workflows/fundraiser-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fundraiser-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: fundraiser-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: barakah-demo-apk
          path: fundraiser-app/android/app/build/outputs/apk/debug/app-debug.apk
